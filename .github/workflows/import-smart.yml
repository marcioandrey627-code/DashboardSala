name: Importar Smart ZIP
on:
  push:
    paths:
      - smart-import.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extrair e publicar arquivos do projeto
        shell: bash
        run: |
          set -euo pipefail
          test -f smart-import.zip || { echo "Arquivo smart-import.zip não encontrado"; exit 1; }
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path

          base = Path.cwd().resolve()
          with ZipFile("smart-import.zip") as archive:
              for item in archive.infolist():
                  filename = Path(item.filename)
                  if item.is_dir() or filename.is_absolute() or ".." in filename.parts or ".git" in filename.parts:
                      continue
                  if item.filename == "smart-import.zip":
                      continue
                  destination = (base / filename).resolve()
                  if not destination.is_relative_to(base):
                      continue
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.read(item))
          PY
          rm -f smart-import.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Importar arquivos do Smart.zip"
            git push
          fi
